services:
  airflow:
    build: .
    image: olympic-final-airflow:local
    container_name: olympic_final_airflow
    restart: unless-stopped

    ports:
      - "8082:8080"

    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://local"

    volumes:
      - ./dags:/opt/airflow/dags
      - ..:/opt/olympic_project

    command: standalone